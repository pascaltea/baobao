<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz · BaoBao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500&display=swap">
  <meta name="theme-color" content="#bdebcc">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="BaoBao">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1><a href="../index.html" class="marque">← <img src="../assets/icons/icon.svg" alt="" width="28" height="28"> BaoBao</a></h1>
    <span class="profil-actif"></span>
  </header>

  <main>
    <section id="choix-theme">
      <h2>❓ Quiz : choisis un thème</h2>
      <p id="aide-quiz" class="carte cache">🐼 Le quiz porte sur les mots que tu as déjà appris. Fais d'abord quelques leçons dans le <a href="../index.html">parcours</a> !</p>
      <div id="themes" class="grille"></div>
    </section>

    <section id="jeu" class="cache">
      <p class="score" id="score"></p>
      <div class="question" id="question"></div>
      <div class="choix" id="choix"></div>
      <div class="retour" id="retour"></div>
      <div class="actions">
        <button class="bouton cache" id="suivant">Suivant →</button>
      </div>
    </section>

    <section id="fin" class="cache" style="text-align:center">
      <p style="font-size:3rem;margin:0" id="fin-emoji"></p>
      <h2 id="fin-titre"></h2>
      <p id="bilan"></p>
      <div class="actions">
        <button class="bouton" id="recommencer">Rejouer</button>
        <button class="bouton secondaire" id="changer">Autre thème</button>
      </div>
    </section>
  </main>

  <script type="module" src="../js/quiz.js"></script>
</body>
</html>
