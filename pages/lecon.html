<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leçon · BaoBao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500&display=swap">
  <meta name="theme-color" content="#e8423f">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="BaoBao">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-lecon">
  <div class="lecon-haut">
    <a href="../index.html" class="fermer" aria-label="Quitter la leçon">✕</a>
    <div class="barre"><span id="barre"></span></div>
    <span id="combo" class="combo"></span>
  </div>

  <main id="zone" class="lecon-zone"></main>

  <div id="bandeau" class="bandeau cache" aria-live="polite">
    <div class="bandeau-contenu">
      <div class="b-mascotte" id="b-mascotte"></div>
      <div class="bandeau-texte">
        <strong id="b-titre"></strong>
        <div id="b-detail"></div>
      </div>
      <button class="bouton" id="continuer">Continuer</button>
    </div>
  </div>

  <script type="module" src="../js/lecon.js"></script>
</body>
</html>
